name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Preflight npm publish secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.REPORACER }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=npm token missing::Configure an npm automation token as the repository secret NPM_TOKEN, NODE_AUTH_TOKEN, or REPORACER before running the release workflow."
            exit 1
          fi
          if ! npm whoami --registry https://registry.npmjs.org > /tmp/reporacer-npm-user.txt; then
            echo "::error title=npm token invalid::The configured npm token was found but npm rejected it. Use an npm automation or granular access token with publish access to reporacer."
            exit 1
          fi
          echo "npm token authenticated as $(cat /tmp/reporacer-npm-user.txt)"

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate third-party notices
        run: pnpm notices

      - name: Generate SBOM
        run: pnpm sbom

      - name: Verify
        run: |
          pnpm lint
          pnpm format:check
          pnpm check
          pnpm test:coverage
          pnpm demo:build
          pnpm demo:check
          pnpm package:smoke
          pnpm docker:sandbox:smoke
          pnpm agents:verify
          pnpm release:audit

      - name: Check release ref matches package version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || '' }}
        run: node scripts/check-release-version.js

      - name: Pack
        run: npm pack --json

      - name: Build Docker image
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN || secrets.REPORACER }}

      - name: Publish Docker image to GHCR
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: |
            reporacer-*.tgz
            artifacts/reporacer.cdx.json
          generate_release_notes: true
