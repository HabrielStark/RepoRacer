name: Demo Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static demo
        run: pnpm demo:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .reporacer-demo-site

      - name: Check Pages availability
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import process from "node:process";

          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/pages`, {
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              "User-Agent": "reporacer-pages-preflight"
            }
          });

          const enabled = response.ok;
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);

          if (!enabled && response.status !== 404) {
            const body = await response.text();
            console.error(`GitHub Pages preflight failed: ${response.status} ${response.statusText}`);
            console.error(body);
            process.exit(1);
          }

          if (!enabled) {
            console.log("GitHub Pages is not enabled for this repository yet; deploy step will be skipped.");
          }
          NODE

      - name: Deploy Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
