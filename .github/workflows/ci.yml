name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Tests
        run: pnpm test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Build
        run: pnpm build

      - name: Demo site link check
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          pnpm demo:build
          pnpm demo:check

      - name: Release audit
        run: pnpm release:audit

      - name: Agent preset smoke
        run: pnpm agents:verify

      - name: SBOM smoke
        run: pnpm sbom

      - name: Third-party notices smoke
        run: pnpm notices

      - name: Package smoke
        run: npm pack --json --dry-run --ignore-scripts

      - name: Packed CLI smoke
        run: pnpm package:smoke

      - name: Docker build smoke
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: docker build -t reporacer:ci .

      - name: Docker CLI image smoke
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: docker run --rm reporacer:ci --version

      - name: Docker sandbox command smoke
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm docker:sandbox:smoke

  examples:
    name: Example projects
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build

      - name: Next.js demo smoke
        run: node examples/nextjs-demo/test/home.test.cjs

      - name: Python demo smoke
        run: python -B -m unittest discover -s examples/python-demo/tests

      - name: Rust demo smoke
        run: cargo test --manifest-path examples/rust-demo/Cargo.toml

      - name: Buggy todo history demo smoke
        run: |
          node examples/buggy-todo-app/scripts/create-history.cjs
          node examples/buggy-todo-app/generated/test/todos.test.cjs

      - name: Buggy todo RepoRacer CLI smoke
        working-directory: examples/buggy-todo-app/generated
        run: |
          node ../../../dist/cli.js init
          node ../../../dist/cli.js tasks --tasks 2
          node ../../../dist/cli.js run --agents fake-success,fake-noop --tasks 1 --json
