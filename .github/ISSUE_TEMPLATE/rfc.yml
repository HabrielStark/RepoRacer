name: RFC
description: Propose a public behavior, scoring, API, adapter, or release-process change.
title: "rfc: "
labels: ["type: rfc"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the intended design and user-visible behavior.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Note CLI, config, report schema, scoring, or API compatibility impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: List rejected alternatives and why they were not chosen.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test Plan
      description: List required unit, integration, CLI, docs, and release checks.
    validations:
      required: true
  - type: textarea
    id: rollout
    attributes:
      label: Rollout Plan
      description: Explain documentation, migration, changelog, and release steps.
    validations:
      required: true
