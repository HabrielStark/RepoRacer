<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="RepoRacer terminal demo">
  <rect width="1120" height="620" rx="18" fill="#0b1020"/>
  <rect width="1120" height="54" rx="18" fill="#151f34"/>
  <circle cx="28" cy="27" r="8" fill="#ff5f57"/>
  <circle cx="54" cy="27" r="8" fill="#ffbd2e"/>
  <circle cx="80" cy="27" r="8" fill="#28c840"/>
  <text x="32" y="98" fill="#8bd3ff" font-family="Consolas,Menlo,monospace" font-size="22">$ reporacer run --agents fake-success,fake-noop --tasks 1</text>
  <text x="32" y="154" fill="#ffffff" font-family="Consolas,Menlo,monospace" font-size="22">Benchmark complete.</text>
  <text x="32" y="214" fill="#d7e6ff" font-family="Consolas,Menlo,monospace" font-size="20">Agent        Solved  Score  Tests  Risk  Time</text>
  <text x="32" y="258" fill="#40e0a0" font-family="Consolas,Menlo,monospace" font-size="20">fake-success 1/1     100    100%   0     1s</text>
  <text x="32" y="302" fill="#f7d774" font-family="Consolas,Menlo,monospace" font-size="20">fake-noop    0/1     20     0%     0     0s</text>
  <text x="32" y="374" fill="#ffffff" font-family="Consolas,Menlo,monospace" font-size="20">Winner for this repo: fake-success</text>
  <text x="32" y="418" fill="#8bd3ff" font-family="Consolas,Menlo,monospace" font-size="20">Report: .reporacer/report.html</text>
</svg>
